name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standard-library test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -t . -v
      - name: Build package
        run: python -m pip install build && python -m build

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install .
      - name: Generate fixtures and run the documented example
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          before = {"tools": [{"name": "echo", "description": "Echo text.", "inputSchema": {"type": "object", "properties": {"text": {"type": "string"}}, "required": ["text"]}, "annotations": {"readOnlyHint": True}}]}
          after = {"tools": [{"name": "echo", "description": "Echo text.", "inputSchema": {"type": "object", "properties": {"text": {"type": "string"}, "uppercase": {"type": "boolean"}}, "required": ["text"]}, "annotations": {"readOnlyHint": True}}]}
          Path("before.json").write_text(json.dumps(before), encoding="utf-8")
          Path("after.json").write_text(json.dumps(after), encoding="utf-8")
          PY
          mcp-ward snapshot before.json -o baseline.json
          mcp-ward check baseline.json after.json --profile wire --format text,html --report-dir reports/
      - name: Upload example report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-ward-report
          path: reports/
          if-no-files-found: ignore
